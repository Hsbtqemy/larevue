<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d231a">
  <title>Hors ligne — Outil éditorial</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fbf8f1; color: #2d231a; font-family: "Inter Tight", "Inter", -apple-system, Helvetica, sans-serif; }
    .offline-card { text-align: center; padding: 48px 32px; max-width: 360px; }
    .offline-icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: #6b5d4e; font-size: 14px; margin: 0 0 24px; line-height: 1.6; }
    button { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px; border: 1px solid #c9bfa6; background: #ffffff; color: #2d231a; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit; }
    button:hover { background: #fbf6ea; border-color: #6b5d4e; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>Pas de connexion</h1>
    <p>L'outil éditorial nécessite une connexion internet. Réessayez dès que vous êtes connecté.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
